
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Language Video Player (YouTube & Local File Support)</title>
    <!-- Font Inter & Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Subtitle Styling for HTML5 Video */
        video::cue {
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            font-size: 1.1rem;
            border-radius: 4px;
            padding: 4px 8px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Header Section -->
    <header class="text-center mb-6 max-w-3xl">
        <h1 class="text-3xl md:text-4xl font-extrabold text-blue-400 mb-2">Dual-Language Video Player</h1>
        <p class="text-slate-400 text-sm md:text-base">Aplikasi Belajar Bahasa Inggris dengan Pemutar Video Dua Sisi (Dukungan Link YouTube & File Lokal)</p>
    </header>

    <!-- Upload & Input Form Section -->
    <div class="bg-slate-800 p-5 md:p-6 rounded-2xl w-full max-w-6xl mb-6 shadow-xl border border-slate-700">
        
        <!-- Tab Mode Selection -->
        <div class="flex justify-center mb-6 border-b border-slate-700 pb-3 gap-4">
            <button id="tab-yt" class="px-5 py-2 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-500/30">
                🎥 Gunakan Link YouTube / Direct URL
            </button>
            <button id="tab-local" class="px-5 py-2 rounded-xl text-sm font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600">
                📁 Upload File Lokal (.mp4, .vtt, .srt)
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Sisi Kiri (English) -->
            <div class="bg-slate-850 p-4 rounded-xl border border-slate-700/60 bg-slate-900/50 flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                    <span class="font-bold text-blue-400 text-sm">🇺🇸 VIDEO ENGLISH (ORIGINAL)</span>
                    <span class="text-xs bg-blue-900/60 text-blue-300 px-2.5 py-0.5 rounded-full border border-blue-700">Sisi Kiri</span>
                </div>

                <!-- Input YouTube/URL EN -->
                <div class="input-yt-group flex flex-col gap-1.5">
                    <label class="text-xs text-slate-300 font-medium">Link YouTube atau Direct MP4 URL:</label>
                    <input type="text" id="yt-url-en" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Input File Lokal EN -->
                <div class="input-local-group hidden flex flex-col gap-2">
                    <label class="text-xs text-slate-300 font-medium">File Video (.mp4 / .webm):</label>
                    <input type="file" id="input-video-en" accept="video/*" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                    
                    <label class="text-xs text-slate-300 font-medium mt-1">File Subtitle English (.vtt / .srt):</label>
                    <input type="file" id="input-sub-en" accept=".vtt,.srt" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">
                </div>
            </div>

            <!-- Sisi Kanan (Indonesia) -->
            <div class="bg-slate-850 p-4 rounded-xl border border-slate-700/60 bg-slate-900/50 flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                    <span class="font-bold text-emerald-400 text-sm">🇮🇩 VIDEO INDONESIA (DUBBING/TRANSLATE)</span>
                    <span class="text-xs bg-emerald-900/60 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-700">Sisi Kanan</span>
                </div>

                <!-- Input YouTube/URL ID -->
                <div class="input-yt-group flex flex-col gap-1.5">
                    <label class="text-xs text-slate-300 font-medium">Link YouTube atau Direct MP4 URL:</label>
                    <input type="text" id="yt-url-id" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <!-- Input File Lokal ID -->
                <div class="input-local-group hidden flex flex-col gap-2">
                    <label class="text-xs text-slate-300 font-medium">File Video (.mp4 / .webm):</label>
                    <input type="file" id="input-video-id" accept="video/*" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
                    
                    <label class="text-xs text-slate-300 font-medium mt-1">File Subtitle Indonesia (.vtt / .srt):</label>
                    <input type="file" id="input-sub-id" accept=".vtt,.srt" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">
                </div>
            </div>

        </div>

        <!-- Tombol Muat Video (Mode YouTube) -->
        <div id="container-btn-load" class="mt-4 flex justify-center">
            <button id="btn-load-yt" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-2.5 px-8 rounded-xl shadow-lg transition duration-200 text-sm">
                🔄 Muat Kedua Video
            </button>
        </div>

    </div>

    <!-- Video Player Display Container -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-6xl">
        
        <!-- Video Card Left (EN) -->
        <div class="bg-slate-800 rounded-2xl overflow-hidden shadow-2xl border border-slate-700 flex flex-col">
            <div class="bg-slate-750 p-3 px-4 flex justify-between items-center border-b border-slate-700 bg-slate-800">
                <span class="font-bold text-slate-200 text-sm">Versi English</span>
                <span class="text-xs font-bold bg-blue-600 text-white px-2.5 py-0.5 rounded">EN</span>
            </div>
            
            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                <!-- HTML5 Video Player -->
                <video id="video-en" class="w-full h-full hidden" controls>
                    <track id="track-en" kind="subtitles" srclang="en" label="English" default>
                </video>
                <!-- YouTube IFrame Embed Container -->
                <div id="yt-player-en" class="w-full h-full"></div>
            </div>
        </div>
        <!-- Video Card Right (ID) -->
        <div class="bg-slate-800 rounded-2xl overflow-hidden shadow-2xl border border-slate-700 flex flex-col">
            <div class="bg-slate-750 p-3 px-4 flex justify-between items-center border-b border-slate-700 bg-slate-800">
                <span class="font-bold text-slate-200 text-sm">Versi Indonesia</span>
                <span class="text-xs font-bold bg-emerald-600 text-white px-2.5 py-0.5 rounded">ID</span>
            </div>
            
            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                <!-- HTML5 Video Player -->
                <video id="video-id" class="w-full h-full hidden" controls>
                    <track id="track-id" kind="subtitles" srclang="id" label="Indonesia" default>
                </video>
                <!-- YouTube IFrame Embed Container -->
                <div id="yt-player-id" class="w-full h-full"></div>
            </div>
        </div>

    </div>

    <!-- Master Synchronized Controls Bar -->
    <div class="mt-6 flex flex-wrap gap-4 justify-center items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl max-w-xl w-full">
        <button id="btn-sync-play" class="flex-1 min-w-[120px] bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
            ▶ Play Dual
        </button>
        <button id="btn-sync-pause" class="flex-1 min-w-[120px] bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
            ⏸ Pause Dual
        </button>
        <select id="select-speed" class="bg-slate-700 text-slate-200 border border-slate-600 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none">
            <option value="0.5">Kecepatan: 0.5x</option>
            <option value="0.75">Kecepatan: 0.75x</option>
            <option value="1" selected>Kecepatan: 1.0x (Normal)</option>
            <option value="1.25">Kecepatan: 1.25x</option>
            <option value="1.5">Kecepatan: 1.5x</option>
        </select>
    </div>

    <!-- Custom Floating Alert Message -->
    <div id="alert-box" class="fixed bottom-5 right-5 bg-slate-800 text-slate-100 border border-slate-700 px-4 py-3 rounded-xl shadow-2xl hidden transition-all duration-300 max-w-md text-sm z-50">
        <span id="alert-msg"></span>
    </div>

    <script>
        // Default Sample Demo Videos (YouTube ID)
        let sampleYtEn = 'dQw4w9WgXcQ';
        let sampleYtId = 'dQw4w9WgXcQ';
        // Helper Extractor ID YouTube (Updated to handle ?feature=shared & mobile links cleanly)
        function extractYouTubeID(url) {
            if (!url) return null;
            // Clean up tracking params
            const cleanUrl = url.trim();
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = cleanUrl.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // YouTube API Ready Initialization
        function onYouTubeIframeAPIReady() {
            playerYT_EN = new YT.Player('yt-player-en', {
                height: '100%',
                width: '100%',
                videoId: sampleYtEn,
                playerVars: { 
                    'autoplay': 0, 
                    'controls': 1, 
                    'cc_load_policy': 1, // Auto show captions if available
                    'hl': 'en'
                },
                events: {
                    'onStateChange': (e) => handleYtStateSync(e, playerYT_EN, playerYT_ID),
                    'onError': (e) => handleYtError(e, 'Sisi Kiri (English)')
                }
            });
            playerYT_ID = new YT.Player('yt-player-id', {
                height: '100%',
                width: '100%',
                videoId: sampleYtId,
                playerVars: { 
                    'autoplay': 0, 
                    'controls': 1, 
                    'cc_load_policy': 1,
                    'hl': 'id'
                },
                events: {
                    'onStateChange': (e) => handleYtStateSync(e, playerYT_ID, playerYT_EN),
                    'onError': (e) => handleYtError(e, 'Sisi Kanan (Indonesia)')
                }
            });
        }

        // Handle YouTube Embed Restriction Errors (Error 150/153/101)
        function handleYtError(event, side) {
            if (event.data === 150  event.data === 101  event.data === 153) {
                showAlert(⚠️ Video ${side} tidak mengizinkan pemutaran di situs luar (Embed Restricted). Coba gunakan video YouTube lain atau upload file MP4 lokal.);
            } else if (event.data === 2) {
                showAlert(⚠️ Link URL video YouTube ${side} tidak valid.);
            }
        }

        // Synchronize YouTube Play/Pause State
        function handleYtStateSync(event, sourcePlayer, targetPlayer) {
            if (activeMode !== 'yt'  isSyncing  !targetPlayer || !targetPlayer.getPlayerState) return;

            const state = event.data;
            if (state === YT.PlayerState.PLAYING) {
                isSyncing = true;
                const sourceTime = sourcePlayer.getCurrentTime();
                if (Math.abs(targetPlayer.getCurrentTime() - sourceTime) > 0.3) {
                    targetPlayer.seekTo(sourceTime, true);
                }
                targetPlayer.playVideo();
                setTimeout(() => { isSyncing = false; }, 300);
            } else if (state === YT.PlayerState.PAUSED) {
                isSyncing = true;
                targetPlayer.pauseVideo();
                setTimeout(() => { isSyncing = false; }, 300);
            }
        }

        // Tab Switching Logic
        const tabYT = document.getElementById('tab-yt');
        const tabLocal = document.getElementById('tab-local');
        const ytInputGroups = document.querySelectorAll('.input-yt-group');
        const localInputGroups = document.querySelectorAll('.input-local-group');
        const btnLoadYtContainer = document.getElementById('container-btn-load');

        tabYT.addEventListener('click', () => {
            activeMode = 'yt';
            tabYT.className = "px-5 py-2 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-500/30";
            tabLocal.className = "px-5 py-2 rounded-xl text-sm font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600";

            ytInputGroups.forEach(el => el.classList.remove('hidden'));
            localInputGroups.forEach(el => el.classList.add('hidden'));
            btnLoadYtContainer.classList.remove('hidden');

            videoEN.classList.add('hidden');
            videoID.classList.add('hidden');
            ytContainerEN.classList.remove('hidden');
            ytContainerID.classList.remove('hidden');

            videoEN.pause();
            videoID.pause();
        });

        tabLocal.addEventListener('click', () => {
            activeMode = 'local';
            tabLocal.className = "px-5 py-2 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-500/30";
            tabYT.className = "px-5 py-2 rounded-xl text-sm font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600";

            localInputGroups.forEach(el => el.classList.remove('hidden'));
            ytInputGroups.forEach(el => el.classList.add('hidden'));
            btnLoadYtContainer.classList.add('hidden');

            ytContainerEN.classList.add('hidden');
            ytContainerID.classList.add('hidden');
            videoEN.classList.remove('hidden');
            videoID.classList.remove('hidden');
            if (playerYT_EN && playerYT_EN.pauseVideo) playerYT_EN.pauseVideo();
            if (playerYT_ID && playerYT_ID.pauseVideo) playerYT_ID.pauseVideo();
        });

        // Load YouTube / Direct URL Video Button
        document.getElementById('btn-load-yt').addEventListener('click', () => {
            const urlEN = document.getElementById('yt-url-en').value.trim();
            const urlID = document.getElementById('yt-url-id').value.trim();

            const idEN = extractYouTubeID(urlEN);
            const idID = extractYouTubeID(urlID);

            if (idEN && playerYT_EN && playerYT_EN.loadVideoById) {
                playerYT_EN.loadVideoById(idEN);
            } else if (urlEN) {
                showAlert('Format link YouTube Sisi Kiri tidak valid. Menggunakan contoh video.');
            }

            if (idID && playerYT_ID && playerYT_ID.loadVideoById) {
                playerYT_ID.loadVideoById(idID);
            } else if (urlID) {
                showAlert('Format link YouTube Sisi Kanan tidak valid. Menggunakan contoh video.');
            }

            if (idEN || idID) {
                showAlert('Berhasil memuat video YouTube!');
            }
        });

        // Local HTML5 Video Upload Handler
        document.getElementById('input-video-en').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                videoEN.src = URL.createObjectURL(file);
                showAlert('Video English Lokal dimuat.');
            }
        });

        document.getElementById('input-video-id').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                videoID.src = URL.createObjectURL(file);
                showAlert('Video Indonesia Lokal dimuat.');
            }
        });

        // Subtitle Converter SRT to WebVTT
        function convertSrtToVtt(srtText) {
            return "WEBVTT\n\n" + srtText
                .replace(/\{.*?\} me/g, '')
                .replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, '$1.$2');
        }

        function handleSubtitleUpload(fileInput, trackElement) {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let content = e.target.result;
                if (file.name.toLowerCase().endsWith('.srt')) {
                    content = convertSrtToVtt(content);
                }
                const blob = new Blob([content], { type: 'text/vtt' });
                trackElement.src = URL.createObjectURL(blob);
                showAlert(Subtitle ${file.name} berhasil diterapkan.);
            };
            reader.readAsText(file);
        }

        document.getElementById('input-sub-en').addEventListener('change', function() {
            handleSubtitleUpload(this, trackEN);
        });

        document.getElementById('input-sub-id').addEventListener('change', function() {
            handleSubtitleUpload(this, trackID);
        });

        // Sync HTML5 Local Video Players
        function syncLocalPlay(source, target) {
            if (activeMode !== 'local' || isSyncing) return;
            isSyncing = true;
            target.play();
            setTimeout(() => isSyncing = false, 150);
        }

        function syncLocalPause(source, target) {
            if (activeMode !== 'local' || isSyncing) return;
            isSyncing = true;
            target.pause();
            setTimeout(() => isSyncing = false, 150);
        }

        function syncLocalSeek(source, target) {
            if (activeMode !== 'local') return;
            if (Math.abs(source.currentTime - target.currentTime) > 0.2) {
                target.currentTime = source.currentTime;
            }
        }

        videoEN.addEventListener('play', () => syncLocalPlay(videoEN, videoID));
        videoEN.addEventListener('pause', () => syncLocalPause(videoEN, videoID));
        videoEN.addEventListener('seeking', () => syncLocalSeek(videoEN, videoID));
        videoID.addEventListener('play', () => syncLocalPlay(videoID, videoEN));
        videoID.addEventListener('pause', () => syncLocalPause(videoID, videoEN));
        videoID.addEventListener('seeking', () => syncLocalSeek(videoID, videoEN));

        // Master Action Buttons
        document.getElementById('btn-sync-play').addEventListener('click', () => {
            if (activeMode === 'yt') {
                if (playerYT_EN && playerYT_EN.playVideo) playerYT_EN.playVideo();
                if (playerYT_ID && playerYT_ID.playVideo) playerYT_ID.playVideo();
            } else {
                videoEN.play();
                videoID.play();
            }
        });

        document.getElementById('btn-sync-pause').addEventListener('click', () => {
            if (activeMode === 'yt') {
                if (playerYT_EN && playerYT_EN.pauseVideo) playerYT_EN.pauseVideo();
                if (playerYT_ID && playerYT_ID.pauseVideo) playerYT_ID.pauseVideo();
            } else {
                videoEN.pause();
                videoID.pause();
            }
        });

        // Speed Control Sync
        document.getElementById('select-speed').addEventListener('change', (e) => {
            const speed = parseFloat(e.target.value);
            if (activeMode === 'yt') {
                if (playerYT_EN && playerYT_EN.setPlaybackRate) playerYT_EN.setPlaybackRate(speed);
                if (playerYT_ID && playerYT_ID.setPlaybackRate) playerYT_ID.setPlaybackRate(speed);
            } else {
                videoEN.playbackRate = speed;
                videoID.playbackRate = speed;
            }
            showAlert(Kecepatan putar diubah ke ${speed}x);
        });
    </script>
</body>
</html>
